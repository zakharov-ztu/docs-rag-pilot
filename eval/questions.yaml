- id: A01
  type: factual
  question: Скільки кредитів підвищення кваліфікації викладач має набрати за п'ять років?
  answers:
  - doc_id: polozhennja pro pidvyshchennja kvalifikaciyi pracivnykiv universytetu 2020
    quote: 3.8. Обсяг підвищення кваліфікації науково-педагогічних і педагогічних працівників Університету
      протягом п’яти років не може бути меншим ніж шість кредитів ЄКТС.
    section_path: 3. ЗМІСТ, ОБСЯГ ПІДВИЩЕННЯ КВАЛІФІКАЦІЇ НАУКОВО-ПЕДАГОГІЧНИХ І ПЕДАГОГІЧНИХ… > 3.8.
      Обсяг підвищення кваліфікації науково-педагогічних і педагогічних…
  reference_answer: 'Не менше шести кредитів ЄКТС за п''ять років: три кредити (90 годин) за дисциплінами,
    які викладає працівник, і три кредити (90 годин) на вдосконалення педагогічної майстерності.'
  notes: Один кредит ЄКТС = 30 годин (п. 3.7).
- id: A02
  type: factual
  question: До котрої години до студента в гуртожиток можуть приходити гості?
  answers:
  - doc_id: pravyla vnutrishnoho rozporjadku v studentskyh hurtozhytkah derzhavnoho universytetu zhytomyrska
      politehnika
    quote: Гостям тільки у позанавчальний час з 08:00 до 22:00 години. При вході до гуртожитку відвідувачі
      пред’являють черговому документ, що посвідчує особу
    section_path: '2. УМОВИ ПРОЖИВАННЯ > 2.3. Вхід до гуртожитку дозволяється:'
  - doc_id: polozhennja pro korystuvannja hurtozhytkamy derzhavnoho universytetu zhytomyrska politehnika
    quote: 4.2. Відвідувачі мають право перебувати в гуртожитку з 8:00 до 22:00.
    section_path: 4. КОРИСТУВАННЯ ГУРТОЖИТКАМИ ЖИТОМИРСЬКОЇ ПОЛІТЕХНІКИ > 4.2. Відвідувачі мають право
      перебувати в гуртожитку з 8:00 до 22:00. Входячи…
  reference_answer: Гості можуть перебувати в гуртожитку з 8:00 до 22:00 (у позанавчальний час), пред'явивши
    черговому документ, що посвідчує особу, та зареєструвавшись у журналі відвідувачів.
  notes: Те саме правило є і в Правилах внутрішнього розпорядку в гуртожитках (п. 2.3), і в Положенні
    про користування гуртожитками (п. 4.2).
