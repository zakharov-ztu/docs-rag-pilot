    section_path: 5. ОЦІНЮВАННЯ РЕЗУЛЬТАТІВ ПІДГОТОВКИ ТА ЗАХИСТУ КУРСОВИХ РОБІТ (ПРОЄКТІВ) > 5.3. Захист
