title: Нормативна база — Державний університет "Житомирська політехніка"
description: Пілотна RAG-система для нормативних документів університету
theme: minima

defaults:
  - scope:
      path: "wiki-pages"
    values:
      layout: document

exclude:
  - source-pdfs
  - scripts
  - "*.pdf"
  - .venv
